<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" preserveAspectRatio="xMidYMid meet">
  <!-- Cute rounded droplet mascot - IDLE -->
  <defs>
    <linearGradient id="gDrop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#9ef0ff" />
      <stop offset="60%" stop-color="#6de9ff" />
      <stop offset="100%" stop-color="#5fb0ff" />
    </linearGradient>
    <radialGradient id="gShine" cx="30%" cy="25%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.95)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
    <filter id="sShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#052233" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Transparent background -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Body -->
  <g transform="translate(100,110)">
    <path id="body" d="M0,-86 C28,-62 46,-44 54,-22 C64,6 56,36 36,64 C16,92 -16,110 -36,70 C-56,110 -88,92 -108,64 C-128,36 -120,6 -110,-22 C-102,-44 -84,-62 -56,-86 C-32,-104 32,-104 0,-86 Z"
          fill="url(#gDrop)" stroke="rgba(255,255,255,0.12)" stroke-width="1.8" filter="url(#sShadow)"/>

    <!-- Gloss highlight integrated into body (upper-left) -->
    <path d="M-34,-58 C-22,-68 0,-74 18,-68 C12,-48 -8,-40 -28,-36 C-38,-44 -40,-52 -34,-58 Z"
          fill="url(#gShine)" opacity="0.95" />

    <!-- Cheeks (subtle) -->
    <ellipse cx="-18" cy="6" rx="12" ry="6" fill="rgba(255,255,255,0.06)" />
    <ellipse cx="18" cy="6" rx="12" ry="6" fill="rgba(255,255,255,0.06)" />

    <!-- Eyes (expressive, neutral) -->
    <g id="eyes" transform="translate(0,12)">
      <ellipse id="eyeL" cx="-20" cy="-4" rx="10" ry="12" fill="#052233" />
      <ellipse id="eyeR" cx="20" cy="-4" rx="10" ry="12" fill="#052233" />
      <!-- pupils -->
      <circle cx="-20" cy="-6" r="4" fill="#02161d" />
      <circle cx="20" cy="-6" r="4" fill="#02161d" />
      <!-- small shine in pupils -->
      <circle cx="-18" cy="-8" r="1.7" fill="#FFFFFF" opacity="0.95" />
      <circle cx="22" cy="-8" r="1.7" fill="#FFFFFF" opacity="0.95" />
    </g>

    <!-- Mouth (gentle smile) -->
    <path id="mouth" d="M-16,18 Q0,26 16,18" stroke="#052233" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
