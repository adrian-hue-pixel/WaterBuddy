<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="260" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <!-- droplet -->
    <path d="M120 60 C120 60 78 115 78 148 a42 42 0 0 0 84 0 C162 115 120 60 120 60 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M100 150 a22 22 0 0 0 16 21" stroke="#0ea5e9" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- title -->
    <text x="205" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#ffffff">WaterBuddy</text>
    <text x="207" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#e0f2fe">Your personalized hydration companion</text>

    <!-- animated waves -->
    <path fill="#ffffff" fill-opacity="0.15" d="M0 210 q37.5 -26 75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-150 0" dur="6s" repeatCount="indefinite"/>
    </path>
    <path fill="#ffffff" fill-opacity="0.25" d="M-150 225 q37.5 -22 75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 V260 H-150 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="150 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
